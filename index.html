<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product correctie calculator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#007bff">
  <!-- Plak hier al je CSS stijlen of zet ze in een los style.css bestand -->
  <style>
    /* Jouw CSS stijlen hier... */
  </style>
</head>
<body>

<div class="card">
  <!-- Header -->
  <div class="header-container">
    <div class="header-branding">
      <img src="logo.png" alt="Logo" class="header-logo">
      <img src="logotekst.png" alt="Product correctie calculator" class="header-text-img">
    </div>
    <button type="button" class="btn-reset-header" onclick="resetCalculator()" title="Wis alle invoer">↺ Reset</button>
  </div>
  
  <!-- Tabs knoppen -->
  <div class="tabs-wrapper">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('tab-calculator', this)">Calculator</button>
      <button class="tab-btn" onclick="switchTab('tab-nieuw', this)">Nieuwe Tab</button>
    </div>

    <div class="tab-content-container">
      <!-- Inhoud wordt hier automatisch ingeladen vanuit externe bestanden -->
      <div id="tab-calculator" class="tab-content active"></div>
      <div id="tab-nieuw" class="tab-content"></div>
    </div>
  </div>

  <!-- Footer / PWA knoppen -->
  <div class="footer-actions">
    <a href="mailto:nielsvde@hotmail.com?subject=Feedback" class="feedback-link">💡 Tip of fout melden</a>
    <button id="installBtn" class="btn-install">📲 Installeer app</button>
    <div id="iosInstruction" class="ios-box">Tik onderaan op het <strong>Deel-icoon</strong> ⎋ en kies <strong>'Zet op home-scherm'</strong>.</div>
  </div>
</div>

<script>
  // Functie om tabs te wisselen en bestanden in te laden
  async function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    btnElement.classList.add('active');
    const targetTab = document.getElementById(tabId);
    targetTab.classList.add('active');

    // Als de tab nog leeg is, laad het bijbehorende HTML-bestand in
    if (targetTab.innerHTML.trim() === '') {
      let fileName = '';
      if (tabId === 'tab-calculator') fileName = 'tab-calculator.html';
      if (tabId === 'tab-nieuw') fileName = 'tab-nieuw.html';

      try {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error('Kan bestand niet laden');
        const html = await response.text();
        targetTab.innerHTML = html;

        // Als het de calculator is, initialiseer de berekeningen direct na het laden
        if (tabId === 'tab-calculator' && typeof onCauseChange === 'function') {
          onCauseChange();
        }
      } catch (err) {
        targetTab.innerHTML = '<p style="color:red; padding:10px;">Fout bij het laden van dit tabblad.</p>';
      }
    }
  }

  // Laad het eerste tabblad direct bij het opstarten van de pagina
  window.addEventListener('DOMContentLoaded', () => {
    switchTab('tab-calculator', document.querySelector('.tab-btn'));
  });
</script>
<script src="app.js"></script> <!-- Hierin staat al je rekenlogica -->
</body>
</html>
