<div>
  <div class="section-title">Evap / Lattiz</div>
  <p style="font-size: 0.85rem; color: #555; margin-bottom: 12px;">
    Plak hieronder je gekopieerde getallen uit Excel.
  </p>

  <div class="form-group">
    <textarea id="excelInput" rows="6" placeholder="Plak hier je getallen..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; resize: vertical;" oninput="calculateExcelSum()"></textarea>
  </div>

  <div class="tab-content-container" style="background: #ffffff; border: 1px solid var(--border-blue); padding: 14px; border-radius: 8px; margin-top: 14px;">
    <div class="result-row">
      <span>Totaal aantal productie runs:</span>
      <span id="excelCount" class="result-value">0</span>
    </div>
    <div class="result-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee;">
      <span style="font-weight: bold; color: var(--primary);">Totale hoeveelheid in liters:</span>
      <span id="excelSum" class="result-value" style="font-size: 1.1rem; color: var(--primary);">0</span>
    </div>
    <div class="result-row" style="margin-top: 8px;">
      <span>Totale hoeveelheid opbrengst in KG:</span>
      <span id="excelYieldKg" class="result-value">0</span>
    </div>
    <div class="result-row" style="margin-top: 8px;">
      <span>Hoeveelheid water:</span>
      <span id="excelWater" class="result-value">0</span>
    </div>
    <div class="result-row" style="margin-top: 8px;">
      <span>Hoeveelheid Evap:</span>
      <span id="excelEvap" class="result-value">0</span>
    </div>
  </div>
</div>
