<div class="section-title">Excel Gegevens Optellen</div>
<p style="font-size: 0.85rem; color: #555; margin-bottom: 12px;">
  Plak hieronder je gekopieerde getallen uit Excel (elke waarde op een nieuwe regel). Het totaal wordt automatisch berekend.
</p>

<div class="form-group">
  <label for="excelInput">Gegevens plakken:</label>
  <textarea id="excelInput" rows="6" placeholder="Plak hier je getallen..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; resize: vertical;" oninput="calculateExcelSum()"></textarea>
</div>

<div class="tab-content-container" style="background: #ffffff; border: 1px solid var(--border-blue); padding: 14px; border-radius: 8px; margin-top: 14px;">
  <div class="result-row">
    <span>Aantal ingevoerde regels:</span>
    <span id="excelCount" class="result-value">0</span>
  </div>
  <div class="result-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee;">
    <span style="font-weight: bold; color: var(--primary);">Totaal som:</span>
    <span id="excelSum" class="result-value" style="font-size: 1.2rem; color: var(--primary);">0</span>
  </div>
</div>
